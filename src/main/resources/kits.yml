### Hezhong Skywars 职业设置
normalKit: # 职业名称
  coins: 0 # 需要耗费的硬币数，0即代表默认拥有
  permission: "" # 需要的权限。空即代表无需权限
  material: "" # 在选择GUI中显示的物品
  items:
    # 格式：物品 : 数量 : [附魔，用;分开] : [附魔等级，用;分开，一一对应] : [耐久/药水名，用;分开，自动识别] : [药水等级，用;分开，一一对应] : [药水时长，用;分开，一一对应]
    - "STONE_SWORD : 1 : SHARPNESS : 1"
    - "DIRT : 32"
